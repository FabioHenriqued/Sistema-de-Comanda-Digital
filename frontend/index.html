<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso ao Sistema | Comanda Digital</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <main class="home" id="conteudo">
      <section class="card login-card" aria-labelledby="login-title">
        <div class="brand login-brand">
          <span class="brand__icon" aria-hidden="true"><span class="receipt-icon"></span></span>
          <span><strong>Comanda Digital</strong><small>Lanchonete</small></span>
        </div>
        <h1 id="login-title">Acesso ao Sistema</h1>
        <form class="login-form" method="post" novalidate>
          <div class="field">
            <label class="field__label" for="email">E-mail</label>
            <input class="field__input" id="email" name="email" type="email"
              autocomplete="username" required />
          </div>
          <div class="field">
            <label class="field__label" for="senha">Senha</label>
            <div class="password-field">
              <input class="field__input" id="senha" name="senha" type="password"
                autocomplete="current-password" required />
              <button class="password-toggle" type="button"
                aria-label="Mostrar senha" aria-controls="senha" disabled>
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"
                  fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="2.5" />
                  <path class="password-toggle__slash" d="m4 4 16 16" />
                </svg>
              </button>
            </div>
          </div>
          <p id="login-message" class="message" role="alert"></p>
          <button class="button button--primary" type="submit" disabled>Entrar</button>
        </form>
        <noscript>Ative o JavaScript para acessar o sistema.</noscript>
      </section>
    </main>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
