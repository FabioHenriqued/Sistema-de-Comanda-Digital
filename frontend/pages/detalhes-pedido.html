<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Pedido | Comanda Digital</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/detalhes-pedido.css" />
  </head>
  <body hidden class="app" data-page="pedidos-em-aberto">
    <div id="app-shell"></div>
    <main class="page" id="conteudo">
      <h1>Detalhes do Pedido</h1>
      <a class="button button--secondary open-orders-back" href="./pedidos-em-aberto.html">Voltar</a>
      <div id="estado-detalhes" role="status">Carregando pedido…</div>
      <div id="detalhes-pedido" class="order-details" hidden>
        <section class="card" aria-labelledby="mesa-pedido">
          <div class="order-details__heading">
            <h2 id="mesa-pedido"></h2>
            <div id="status-pedido"></div>
          </div>
          <dl class="open-order__facts">
            <div><dt>Abertura</dt><dd><time id="abertura-pedido"></time></dd></div>
            <div id="finalizacao-pedido" hidden><dt>Finalização</dt><dd>Data e horário indisponíveis</dd></div>
            <div><dt>Proprietária responsável</dt><dd id="proprietaria-pedido"></dd></div>
          </dl>
          <div class="order-details__actions order-details__order-actions">
            <button type="button" id="finalizar-pedido" class="button button--primary" aria-haspopup="dialog" hidden>
              Finalizar Pedido
            </button>
            <button type="button" id="excluir-pedido" class="button button--danger" aria-haspopup="dialog" hidden>
              Excluir Pedido
            </button>
          </div>
        </section>
        <section class="card" aria-labelledby="titulo-itens">
          <div class="order-details__heading">
            <h2 id="titulo-itens">Itens do pedido</h2>
            <button type="button" id="adicionar-produto" class="button button--secondary" hidden>+ Adicionar Produto</button>
          </div>
          <p id="detalhes-itens-vazios" hidden>Nenhum produto no pedido.</p>
          <ul id="detalhes-itens" class="order-details__items"></ul>
          <p class="order-details__total" aria-live="polite" aria-atomic="true">
            <span id="rotulo-total">Total parcial</span> <strong id="detalhes-total"></strong>
          </p>
          <div id="erro-edicao" role="alert"></div>
          <div id="acoes-edicao" class="order-details__actions" hidden>
            <button type="button" id="salvar-alteracoes" class="button button--primary">Salvar Alterações</button>
            <a class="button button--secondary" href="./pedidos-em-aberto.html">Cancelar</a>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="../js/detalhes-pedido.js"></script>
  </body>
</html>
